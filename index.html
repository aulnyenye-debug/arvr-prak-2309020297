<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Praktikum 1 - Scene Perkenalan Diri Kustom</title>
  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
</head>
<body>
  <a-scene>
    <!-- 1. Tiga Objek Primitif Unik & Berbeda -->
    <!-- Objek 1: Donat (Torus) Berwarna Ungu dengan Animasi Putar -->
    <a-torus position="-1.5 1 -3" radius="0.8" radius-tubular="0.2" color="#9b59b6" 
           animation="property: rotation; to: 360 360 0; loop: true; dur: 7000; easing: linear"></a-torus>
    
    <!-- Objek 2: Kerucut (Cone) Berwarna Oranye Terang -->
    <a-cone position="0 1 -4" radius-bottom="0.9" height="1.8" color="#e67e22"></a-cone>
    
    <!-- Objek 3: Kotak Panjang (Box) Berwarna Hijau Tosca -->
    <a-box position="1.5 0.75 -3" width="1" height="1.5" depth="1" color="#1abc9c"
           animation="property: position; to: 1.5 1.2 -3; dir: alternate; loop: true; dur: 2000; easing: easeInOutSine"></a-box>

    <!-- 2. Teks Nama & NIM -->
    <a-text value="Dinda Aulia - 2309020297" position="0 2.8 -3" align="center" color="#2c3e50" width="6"></a-text>

    <!-- 3. Lantai dan Langit dengan Nuansa Berbeda -->
    <a-plane position="0 0 -4" rotation="-90 0 0" width="10" height="10" color="#34495e"></a-plane>
    <a-sky color="#f1c40f"></a-sky>
  </a-scene>
</body>
</html>
